[package]
name = "prism"
version = "0.1.0"
edition = "2021"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
