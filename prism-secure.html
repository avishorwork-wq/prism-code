<h1>Prism Secure</h1><p class="sub">Lock a Prism code with a password, and sign it so people can tell it is really yours. Works offline, nothing leaves this device.</p>

<div><button class="alt" id="expkey">Export key (backup file)</button><button class="alt" id="impkey">Import key</button><input type="file" id="impfile" accept=".json" hidden></div><div style="color:#9aa;font-size:14px">The backup file holds your private key. Keep it somewhere safe and private.</div>
<button id="make">Create code</button>
<div id="info"></div><canvas id="code" hidden></canvas></div>
<div class="card"><b>2. Read it back</b>
<label>Password to open</label><input type="text" id="pw2">
<button id="scan">Scan the code above</button><div id="out"></div></div>
