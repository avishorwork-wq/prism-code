<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1922">
<title>Phone test · Prism code locator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b1922}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;pointer-events:none}
#bg{position:absolute;left:0;top:0;will-change:filter}
#dark{background:radial-gradient(120% 95% at 50% 44%,rgba(0,0,0,0) 40%,rgba(8,6,14,.58) 100%)}
#light{background:radial-gradient(95% 75% at 50% 38%,#fcfaff 0%,#f4f1fc 58%,#e9e5f6 100%);visibility:hidden}
#card{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none;opacity:0}
#fx{position:absolute;left:0;top:0;pointer-events:none}
#curtain{background:#fff;opacity:0}
#vid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#dbg{position:absolute;left:8px;bottom:8px;width:160px;display:none;image-rendering:pixelated;border:1px solid #fff4}

#pill{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + max(30px,7.5vh));
  width:min(284px,88vw);height:48px;display:flex;align-items:center;gap:12px;padding:0 18px 0 13px;
  border-radius:999px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 10px 28px rgba(30,20,60,.20);font-size:14.5px;font-weight:600;letter-spacing:.005em;
  opacity:0;transform:translate(-50%,10px)}
#ring{width:24px;height:24px;flex:none;overflow:visible}
#ring circle,#ring path{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#ring .track{stroke:currentColor;opacity:.2}
#arc,#check{stroke:var(--acc)}
#lab{position:relative;flex:1;height:20px}
#lab span{position:absolute;left:0;top:0;line-height:20px;white-space:nowrap;will-change:transform,opacity}
#pct{min-width:40px;text-align:right;font-variant-numeric:tabular-nums;opacity:0;font-weight:600}

#ctrls{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;display:flex;gap:10px;opacity:0}
.btn{height:40px;min-width:40px;padding:0 13px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;font:600 13px/1 system-ui,sans-serif;cursor:pointer}
.btn:active{transform:scale(.94)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="dark" class="layer"></div>
  <div id="light" class="layer"></div>
  <canvas id="card"></canvas>
  <canvas id="fx"></canvas>
  <div id="curtain" class="layer"></div>
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="dbg"></canvas>

  <div id="pill">
    <svg id="ring" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="track" cx="12" cy="12" r="9"/>
      <circle id="arc" cx="12" cy="12" r="9" pathLength="1" transform="rotate(-90 12 12)"/>
      <path id="check" d="M7.6 12.5l3 3 5.9-6.3" pathLength="1"/>
    </svg>
    <div id="lab"><span id="lab0"></span><span id="lab1"></span></div>
    <span id="pct">0%</span>
  </div>

  <div id="ctrls">
    <button class="btn" id="photo" aria-label="Use a photo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10.5" r="1.6"/><path d="M21 16l-5-4.5L7 19"/></svg></button>
    <button class="btn" id="slow" aria-label="Toggle slow motion">1×</button>
    <button class="btn" id="replay" aria-label="Scan again"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.6h4.6"/></svg></button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

  const Hc = homography([[0, 0], [S, 0], [S, S], [0, S]], corners); cardEl.style.transform = cssMatrix(Hc, PAD);

  // backdrop: freeze → blur/dim → dissolve into the light stage through an iris
  const ie = irisE(tl), R = lerp(-feather, Rmax, ie), bl = 7 * smooth(TL.rectStart, TL.rectStart + .7, tl);
  bgEl.style.filter = bl > .05 ? 'blur(' + bl.toFixed(2) + 'px) brightness(' + (1 - .35 * smooth(TL.rectStart, TL.rectStart + .7, tl)).toFixed(3) + ')' : 'none';
  darkEl.style.opacity = (1 - ie).toFixed(3);
  if (ie <= 0) lightEl.style.visibility = 'hidden';
  else {
    lightEl.style.visibility = 'visible';
    const m = ie >= 1 ? 'none' : 'radial-gradient(circle at ' + cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px,#000 ' + Math.max(0, R - feather).toFixed(1) + 'px,transparent ' + Math.max(0, R + feather).toFixed(1) + 'px)';
    lightEl.style.webkitMaskImage = m; lightEl.style.maskImage = m;
  }
  curtain.style.opacity = (tl > 0 ? .45 * Math.exp(-tl / .12) : 0).toFixed(3);

  // brackets
  const lockMix = 1, lt = tl - TL.lock, rc = rcard(tl);
  const pad = S * (.030 + .004 * springStep(lt, 26, .48)), vp = E.settle(clamp((tl - TL.verify) / .6));
  const P = { pad, arm: lerp(S * (.16 + .03 * Math.sin(Math.PI * clamp(lt / .5)) - .04 * smooth(.3, .8, lt)), 1e5, vp), nz: 0, rc,
    col: lerpArr(CYAN, GREEN, smooth(TL.verify, TL.verify + .35, tl)), alpha: lerp(1, .55, smooth(TL.pulse, TL.pulse + .9, tl)),
    dim: .36 * (1 - smooth(TL.irisStart, TL.irisStart + .5, tl)),
    rings: [{ tau: lt, dur: .85, col: CYAN, a: .75, scale: .26 }, { tau: lt - .13, dur: .85, col: CYAN, a: .45, scale: .26 }, { tau: tl - TL.pulse, dur: .9, col: GREEN, a: .65, scale: .22 }] };
  P.rb = rc + pad * lockMix;
  drawFX(corners, P);

  // HUD
  const reach = pt => 1 - smooth(R - feather, R + feather, Math.hypot(pt[0] - cx, pt[1] - cy)), ok = smooth(TL.verify + .05, TL.verify + .4, tl);
  setLabel(readerPhase==='failed' ? 'Not verified' : tl>=TL.verify-.021&&readerPhase==='pending' ? 'Reading code…' : tl < TL.rectStart + .1 ? 'Locked on' : tl < TL.scanStart - .05 ? 'Straightening' : tl < TL.verify + .05 ? 'Calibrating colors' : 'Code located');
  const by = lerp(beamY0, beamY1, scanU(tl)), pct = clamp((by - .12 * S) / (.76 * S));
  let len, rot = -90, ra = 1;
  if (tl < TL.scanStart - .05) { len = lerp(st.ringAtLock, 1, E.out(clamp(tl / .35))); ra = 1 - smooth(TL.rectStart + .3, TL.rectStart + .8, tl); }
  else if (tl < TL.scanEnd) { len = pct; ra = smooth(TL.scanStart - .05, TL.scanStart + .1, tl); } else len = 1;
  hud(reach(pillPt), reach(ctrlPt), ok, { len, rot, a: ra, check: 1 - E.out(clamp((tl - TL.verify - .1) / .35)), scale: 1 + .16 * bump((tl - TL.verify - .05) / .22) },
    Math.round(tl >= TL.scanEnd ? 100 : pct * 100), .8 * smooth(TL.scanStart - .05, TL.scanStart + .15, tl), 1);
  if(readerPhase==='failed'||tl>=TL.verify-.021&&readerPhase==='pending')pctEl.style.opacity=0;
}

let lastTs = 0;
function step(dt) {
  st.clock += dt;
  probeReader();
  if (src && (st.mode === 'search' || st.mode === 'track') && st.clock - st.lastDet >= .05 - 1e-6 && (src.kind !== 'camera' || vid.readyState >= 2)) {
    try { grabDet(src.el, src.w, src.h); onDetect(verifiedReaderCandidate() || (measured ? null : (()=>{const v=detect();return v&&validPrismQuad(v.q)?v:null;})())); } catch (e) { onDetect(null); }
  }
  if (st.mode === 'search' && st.cand && st.seen >= 3) st.mode = 'track';
  if (st.mode === 'track') {
    if (!st.cand) { st.mode = 'search'; st.hold = 0; }
    else {
      st.hold = clamp(st.hold + (st.jit < .028 && st.lost < .12 && (st.cand.raw?.source!=='verified-reader'||st.cand.raw.motionSpeed<.12) ? dt / .8 : st.lost >= .12 ? -dt * .6 : -dt * 1.5));
      if (st.hold >= 1) lock();
    }
  }
  if (st.mode === 'search' || st.mode === 'track') { updatePre(dt); renderPre(); }
  else {
    st.tl += dt * st.speed;
    if(st.tl>=TL.verify&&readerPhase!=='verified'){st.tl=TL.verify-.02;if(readerPhase==='failed')st.mode='done';}
    if (!st.fired.pulse && st.tl >= TL.pulse) { st.fired.pulse = 1; buzz([10, 50, 16]); }
    if (st.tl >= TL.end) { st.tl = TL.end; st.mode = 'done'; emitPrismCapture(); }
    renderLocked();
  }
}
function loop(ts) { const dt = Math.min(.05, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts; step(dt); requestAnimationFrame(loop); }

/* ---------- layout & wiring ---------- */
function layout() {
  W = innerWidth; H = innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2); const bd = Math.min(dpr, 1.5);
  S = Math.round(clamp(Math.min(W * .76, H * .5), 190, 520)); cx = W / 2; cy = H * .45; PAD = Math.round(S * .26);
  bgEl.width = Math.round(W * bd); bgEl.height = Math.round(H * bd); bgEl.style.width = W + 'px'; bgEl.style.height = H + 'px';
  const cw = Math.round((S + 2 * PAD) * dpr); cardEl.width = cardEl.height = cw; cardEl.style.width = cardEl.style.height = (cw / dpr) + 'px';
  fxEl.width = Math.round(W * dpr); fxEl.height = Math.round(H * dpr); fxEl.style.width = W + 'px'; fxEl.style.height = H + 'px';
  const maxD = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)); feather = maxD * .16; Rmax = maxD + feather;
  beamY0 = -.03 * S; beamY1 = 1.10 * S;
  const pr = pill.getBoundingClientRect(), cr = ctrls.getBoundingClientRect();
  pillPt = [pr.left + pr.width / 2, pr.top + pr.height / 2]; ctrlPt = [cr.left + cr.width / 2, cr.top + cr.height / 2];
  updateCover();
}
replayBtn.addEventListener('click', e => { e.stopPropagation(); if(src)resetSearch();else startCamera(); });
$('stage').addEventListener('click', () => { if (st.mode === 'done') resetSearch(); });
slowBtn.addEventListener('click', () => { st.speed = st.speed === 1 ? .25 : 1; slowBtn.textContent = st.speed === 1 ? '1×' : '¼×'; });
photoBtn.addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => { const f = fileIn.files && fileIn.files[0]; if (f) loadImage(URL.createObjectURL(f)); fileIn.value = ''; });
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); if (st.mode === 'locked' || st.mode === 'done') drawBG(); }, 80); });

layout(); applyUI(pill, 0, 0); applyUI(ctrls, 0, 0); resetSearch();
window.__scan = { geometry:()=>({viewport:{W,H,S,cx,cy},candidate:st.cand,followed:cor.p,capture:st.cap}), step, state: () => ({ mode: st.mode, hold: st.hold, tl: st.tl, found: st.found, seen: st.seen, cand: st.cand && st.cand.q, jit: st.jit }), loadImage, TL,
  setCanvas: c => setSource({ kind: 'canvas', el: c, w: c.width, h: c.height }), detectNow: () => { grabDet(src.el, src.w, src.h); return detect(); }, why: () => lastWhy, setTL: t => { st.tl = t; } };
if (!MANUAL) { startCamera(); requestAnimationFrame(loop); }
})();
</script>

<script data-prism-standalone-result>
(()=>{
const api=window.PrismLocator,pill=document.querySelector('#pill');if(!api||!pill)return;
const style=document.createElement('style');style.textContent=`#prism-scan-result{box-sizing:border-box;width:calc(100vw - 36px);max-width:390px;max-height:calc(100dvh - 40px);overflow:auto;margin:auto;padding:22px;border:1px solid #e4dff0;border-radius:24px;background:#faf9ff;color:#3a3550;box-shadow:0 24px 70px #1d12354d;font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}#prism-scan-result::backdrop{background:#1b15265c;backdrop-filter:blur(4px)}#prism-scan-result h2{font-size:19px;margin:0 0 5px}#prism-scan-result p{font-size:13px;color:#696278;margin:0 0 14px}#prism-scan-result textarea{box-sizing:border-box;width:100%;min-height:112px;max-height:35vh;padding:12px;border:1px solid #dcd5e9;border-radius:13px;background:white;color:#292333;font:inherit;font-size:14px;line-height:1.5;resize:vertical}#prism-scan-result .result-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}#prism-scan-result button,#prism-scan-result a{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:9px 14px;border:1px solid #dcd5e9;border-radius:13px;background:white;color:#3a3550;text-decoration:none;font:inherit;font-size:14px;font-weight:600;cursor:pointer}#prism-scan-result a{background:#e2faf0;color:#0a6e4e;border-color:#a3e6cd}#prism-scan-result [hidden]{display:none!important}#prism-scan-result .result-host{overflow-wrap:anywhere;margin:10px 0 0;font-size:12px}#prism-scan-result .result-status{min-height:19px;margin:10px 0 0;font-size:12px}`;document.head.append(style);
const dialog=document.createElement('dialog');dialog.id='prism-scan-result';dialog.setAttribute('aria-labelledby','prism-result-title');dialog.innerHTML='<h2 id="prism-result-title">Verified scan</h2><p>This result is from the captured image.</p><textarea readonly aria-label="Decoded text" spellcheck="false"></textarea><p class="result-host" hidden></p><div class="result-actions"><button type="button" data-result-copy>Copy text</button><a target="_blank" rel="noopener noreferrer" hidden>Open link</a><button type="button" data-result-close>Close</button></div><p class="result-status" role="status" aria-live="polite"></p>';document.body.append(dialog);
const field=dialog.querySelector('textarea'),link=dialog.querySelector('a'),host=dialog.querySelector('.result-host'),status=dialog.querySelector('.result-status');let last=null;
function ready(){const s=api.state();return !!last&&s.mode==='done'&&s.verified&&s.resultSent;}
function close(){if(dialog.open)dialog.close();}
function clear(){last=null;close();field.value='';link.removeAttribute('href');link.hidden=true;host.hidden=true;status.textContent='';pill.style.pointerEvents='none';pill.removeAttribute('role');pill.removeAttribute('tabindex');pill.removeAttribute('aria-label');pill.removeAttribute('title');}
function open(){if(!ready())return;field.value=typeof last.text==='string'?last.text:Array.from(last.bytes||[],v=>Number(v).toString(16).padStart(2,'0')).join(' ');status.textContent='';link.hidden=true;link.removeAttribute('href');host.hidden=true;try{const url=new URL(field.value.trim());if((url.protocol==='https:'||url.protocol==='http:')&&!url.username&&!url.password){link.href=url.href;link.hidden=false;host.textContent='Destination: '+url.hostname;host.hidden=false;}}catch(e){}dialog.showModal();}
api.onResult(result=>{last=result;pill.style.pointerEvents='auto';pill.setAttribute('role','button');pill.tabIndex=0;pill.setAttribute('aria-label','View verified scan result');pill.title='View verified scan result';});
pill.addEventListener('click',e=>{if(!ready())return;e.stopPropagation();open();});pill.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&ready()){e.preventDefault();e.stopPropagation();open();}});
dialog.querySelector('[data-result-close]').addEventListener('click',close);dialog.addEventListener('click',e=>{if(e.target===dialog)close();});dialog.querySelector('[data-result-copy]').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(field.value);status.textContent='Copied';}catch(e){field.focus();field.select();field.setSelectionRange(0,field.value.length);let copied=false;try{copied=document.execCommand('copy');}catch(e){}status.textContent=copied?'Copied':'Select the text to copy it.';}});
for(const id of ['replay','photo'])document.getElementById(id)?.addEventListener('click',clear);document.getElementById('file')?.addEventListener('change',clear);document.getElementById('stage')?.addEventListener('click',()=>{if(!api.state().verified)clear();});document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();});addEventListener('pagehide',clear);
})();

</script>
